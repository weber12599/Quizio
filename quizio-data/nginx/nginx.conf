# worker processes auto configuration
worker_processes auto;

events {
    # Connections per worker
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Basic optimizations
    sendfile        on;
    keepalive_timeout  65;

    # Setup Nginx cache zone
    # keys_zone=media_cache:10m -> 10MB zone for cache keys
    # max_size=5g -> Maximum cache size on disk is 5GB
    # inactive=24h -> Remove cached items not accessed in 24 hours
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=5g inactive=24h use_temp_path=off;

    server {
        listen 80;

        # Add headers to check cache hit/miss status in browser
        add_header X-Proxy-Cache $upstream_cache_status;
        add_header Access-Control-Allow-Origin *;

        location / {
            # Proxy request to SeaweedFS Volume server
            proxy_pass http://seaweedfs-volume:8081;

            # Enable cache for this location
            proxy_cache media_cache;

            # Cache 200 OK responses for 24 hours
            proxy_cache_valid 200 24h;

            # Ignore SeaweedFS Cache-Control headers to enforce our caching
            proxy_ignore_headers Cache-Control;

            # Pass original request headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}