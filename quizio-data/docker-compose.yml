services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 10
  seaweedfs-master:
    image: chrislusf/seaweedfs
    ports:
      - "9333:9333"
      - "19333:19333"
    command: "master -ip=seaweedfs-master -port=9333 -mdir=/data"
    volumes:
      - ./seaweedfs/master:/data
    restart: unless-stopped
  seaweedfs-volume:
    image: chrislusf/seaweedfs
    ports:
      - "8081:8081"
      - "18081:18081"
    command: "volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -port=8081 -dir=/data"
    depends_on:
      - seaweedfs-master
    volumes:
      - ./seaweedfs/volume:/data
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      # Map to host port 8088 to avoid conflicts, adjust as needed
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - seaweedfs-volume
    restart: unless-stopped
  backend:
    build:  ./backend
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
  frontend:
    build: ./frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
