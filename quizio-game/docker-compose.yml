services:
  backend:
    build: 
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Exclude node_modules from host volume override
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
  cloudflared:
    image: cloudflare/cloudflared:latest
    # Tell cloudflared to point to our Vue frontend dev server
    command: tunnel --url http://frontend:5173
    restart: unless-stopped
    depends_on:
      - frontend