services:
  backend:
    image: weber12599/quizio-game-backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_SERVICE_BASE_URL=${DATA_SERVICE_BASE_URL}
    restart: unless-stopped
  frontend:
    image: weber12599/quizio-game-frontend:latest
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_PROXY_BASE_URL=${VITE_API_PROXY_BASE_URL}
      - VITE_SOCKET_PROXY_BASE_URL=${VITE_SOCKET_PROXY_BASE_URL}
      - VITE_MEDIA_PROXY_BASE_URL=${VITE_MEDIA_PROXY_BASE_URL}
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url ${GAME_BASE_URL} --protocol http2
    restart: unless-stopped
    depends_on:
      - frontend