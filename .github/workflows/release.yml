name: Build, Push and Release Quizio Game

on:
  # Trigger automatically when a version tag (e.g., v1.0.0) is pushed
  push:
    tags:
      - 'v*'
  # Allow manual trigger with a specific version name
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

# Required permission to create a GitHub Release
permissions:
  contents: write

jobs:
  # ==========================================
  # Job 1: Build and Push Docker Images
  # ==========================================
  build-and-push-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Determine the tag name to be used for Docker images
      - name: 🏷️ Determine Release Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: 🏗️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./quizio-game/frontend 
          push: true
          platforms: linux/amd64,linux/arm64
          # Apply both the specific version tag and the 'latest' tag
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quizio-game-frontend:${{ env.TAG_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/quizio-game-frontend:latest

      - name: 🐍 Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./quizio-game/backend
          push: true
          platforms: linux/amd64,linux/arm64
          # Apply both the specific version tag and the 'latest' tag
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quizio-game-backend:${{ env.TAG_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/quizio-game-backend:latest

  # ==========================================
  # Job 2: Build Electron App and Create Release
  # ==========================================
  build-and-release-electron:
    # Ensure Docker images are pushed before building the app release
    needs: build-and-push-docker
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: quizio-game/electron/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd quizio-game/electron
          npm install

      - name: 🏗️ Build Electron App
        run: |
          cd quizio-game/electron
          npx electron-builder --mac --universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 📝 Add INSTALL_GUIDE to DMG
        run: |
          set -e

          # Find the DMG file
          DMG_FILE=$(find quizio-game/electron/dist-electron -name "QuizioGame*.dmg" -not -name "*.blockmap" | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "❌ No DMG file found"
            exit 1
          fi

          echo "📦 Processing: $DMG_FILE"

          TEMP_DIR=$(mktemp -d)
          trap "rm -rf $TEMP_DIR" EXIT

          # Convert DMG to read-write format
          TEMP_DMG="$TEMP_DIR/temp.dmg"
          echo "🔄 Converting to read-write format..."
          hdiutil convert "$DMG_FILE" -format UDRW -o "$TEMP_DMG" > /dev/null 2>&1 || true

          # Mount the read-write DMG
          echo "📂 Mounting DMG..."
          MOUNT_POINT=$(hdiutil attach "$TEMP_DMG" | grep -oE '/Volumes/[^ ]+' | head -1)
          if [ -z "$MOUNT_POINT" ]; then
            MOUNT_POINT="/Volumes/QuizioGame"
            hdiutil attach "$TEMP_DMG" -mountpoint "$MOUNT_POINT" -nobrowse
          fi

          # Copy INSTALL_GUIDE.txt
          echo "📋 Adding INSTALL_GUIDE.txt..."
          cp quizio-game/electron/INSTALL_GUIDE.txt "$MOUNT_POINT/" || true

          # Unmount
          sleep 1
          hdiutil detach "$MOUNT_POINT" || true

          # Convert back to read-only format and replace original
          echo "🔄 Converting back to compressed format..."
          hdiutil convert "$TEMP_DMG" -format UDZO -o "$DMG_FILE" || true

          echo "✅ INSTALL_GUIDE.txt added to DMG successfully"

      # Determine the tag name based on how the workflow was triggered
      - name: 🏷️ Determine Release Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: 🚀 Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: quizio-game/electron/dist-electron/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}